name: Push ETF Band Status

on:
  schedule:
    - cron: "0 2,6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-etf-band-status
  cancel-in-progress: false

jobs:
  push-band-status:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      PUSHPLUS_TO: ${{ secrets.PUSHPLUS_TO }}
      PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Push current ETF band status
        run: python scripts/check_signals.py --mode status
