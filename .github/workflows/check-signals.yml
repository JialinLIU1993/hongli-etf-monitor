name: Check ETF Signals

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-etf-signals
  cancel-in-progress: false

jobs:
  check-signals:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      SIGNAL_STATE_FILE: .cache/check-signals/pushplus_sent.json
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      PUSHPLUS_TO: ${{ secrets.PUSHPLUS_TO }}
      PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare signal state directory
        run: mkdir -p .cache/check-signals

      - name: Restore signal notification state
        uses: actions/cache/restore@v4
        with:
          path: .cache/check-signals
          key: check-signals-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            check-signals-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check signals and push notifications
        run: python scripts/check_signals.py

      - name: Save signal notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/check-signals
          key: check-signals-state-${{ github.run_id }}-${{ github.run_attempt }}
